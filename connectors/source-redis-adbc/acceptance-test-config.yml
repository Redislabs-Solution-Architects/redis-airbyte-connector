{
  "connector_image": "redis-airbyte/source-redis-adbc:tested",
  "test_strictness_level": "high",
  "acceptance_tests": {
    "spec": {
      "tests": [
        {
          "spec_path": "spec.json",
          "config_path": "config.json"
        }
      ]
    },
    "connection": {
      "tests": [
        {
          "config_path": "config.json",
          "status": "succeed"
        },
        {
          "config_path": "invalid.json",
          "status": "failed"
        }
      ]
    },
    "discovery": {
      "tests": [
        {
          "config_path": "config.json"
        }
      ]
    },
    "basic_read": {
      "tests": [
        {
          "config_path": "config.json",
          "expect_records": {
            "path": "expected.jsonl",
            "extra_records": false
          },
          "validate_data_points": true
        }
      ]
    },
    "full_refresh": {
      "tests": [
        {
          "config_path": "config.json"
        }
      ]
    },
    "incremental": {
      "bypass_reason": "Full refresh only; incremental sync and CDC are unsupported."
    }
  }
}
